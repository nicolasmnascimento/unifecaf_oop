# Ative este perfil com: --spring.profiles.active=mysql
# Defina as variaveis de ambiente DB_URL, DB_USERNAME e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestao_veiculos?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
