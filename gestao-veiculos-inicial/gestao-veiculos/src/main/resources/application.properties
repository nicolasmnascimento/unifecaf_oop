spring.application.name=gestao-veiculos
server.port=8080

# Perfil padrao para desenvolvimento inicial: banco H2 em memoria.
# Isso permite validar a API mesmo antes de configurar o MySQL.
spring.datasource.url=jdbc:h2:mem:gestaoveiculos;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
